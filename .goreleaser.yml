version: 2

project_name: gsx

builds:
  - id: gsx
    main: ./cmd/gsx
    binary: gsx
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=
  - id: gsx-typebundle
    main: ./cmd/gsx-typebundle
    binary: gsx-typebundle
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -buildid=

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: false
    files: []

checksum:
  name_template: checksums.txt

release:
  github:
    owner: joeblew999
    name: gsx
  replace_existing_artifacts: true
