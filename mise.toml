# Everything this project does is a task below; `mise tasks` lists them.
# The upstream way stays as it is (Makefile, workflows); this adds the stack's
# tool for the release and the Fly deploy, so the fork needs nothing by hand.

[tools]
go = "1.27"
"packslip:github.com/joeblew999/dev" = "0.2.0"   # the stack's tool; `dev` lists its verbs, its skill is .claude/skills/dev
goreleaser = "latest"
packslip = "latest"
gh = "latest"
flyctl = "latest"   # the playground deploys to Fly, as upstream does

[settings.skills]
auto_sync = true
prune = true

# Exact packslip pins are signature-checked; the 24h wait only ever held CI.
[settings]
minimum_release_age_excludes = ["packslip:*"]

# --- release: goreleaser from .goreleaser.yml (gsx and gsx-typebundle), plus a
# packslip manifest that ships skills/gsx. Locally `mise run release <version>`
# tags, builds, signs and publishes; CI's release.yml runs the same task on a
# pushed tag and signs with the workflow's identity.

[tasks.release]
description = "publish a GitHub Release: <version> locally, the pushed tag in CI"
raw = true
run = "dev release ."

[tasks."release:snapshot"]
description = "build the release, sign and verify its manifest, publish nothing"
run = "dev release . --snapshot"

# --- the playground render service on Fly (playground/server/fly.toml), deployed
# from the repo root as build context and one machine, as upstream's workflow does.

[tasks."playground:deploy"]
description = "deploy the playground to Fly (FLY_API_TOKEN from fnox, or a flyctl login)"
run = "dev deploy playground/server -- --ha=false"

[tasks."playground:url"]
description = "the deployed playground's URL"
run = "dev url playground/server --deployed"

[tasks."playground:logs"]
description = "the deployed playground's logs"
run = "dev logs playground/server"

[tasks.test]
description = "Run the full test suite the way CI does"
run = "go test ./... -count=1 -parallel 4"
